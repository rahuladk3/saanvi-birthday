<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Birthday 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
body{overflow:hidden;background:black;color:white;}
.section{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
transition:1s;
text-align:center;
padding:20px;
}

/* PAGE POSITIONS */
#page1{background:black;}
#page2{transform:translateX(100%);background:#111;}
#page3{transform:translateX(200%);background:#1a1a2e;}
#page4{transform:translateX(300%);background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);}

.active-page2 #page1{transform:translateX(-100%);}
.active-page2 #page2{transform:translateX(0);}

.active-page3 #page2{transform:translateX(-100%);}
.active-page3 #page3{transform:translateX(0);}

.active-page4 #page3{transform:translateX(-100%);}
.active-page4 #page4{transform:translateX(0);}

/* TITLE */
.main-title{
font-size:45px;
margin-bottom:30px;
background:linear-gradient(45deg,navy,cherryred);
-webkit-background-clip:text;
color:transparent;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px navy;}
to{text-shadow:0 0 30px red;}
}

/* BUTTON */
button{
padding:14px 30px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
margin-top:20px;
background:linear-gradient(45deg,#ff416c,#ff4b2b);
color:white;
transition:0.3s;
}
button:hover{transform:scale(1.1);}

/* GRID */
.media-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:20px;
width:90%;
max-width:1000px;
margin-top:20px;
}
.media-grid img,
.media-grid video{
width:100%;
border-radius:15px;
}

/* CALL GRID */
.call-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:30px;
width:90%;
max-width:1000px;
margin-top:30px;
}

.call-grid img{
width:100%;
border-radius:20px;
box-shadow:0 15px 25px rgba(0,0,0,0.4);
transition:0.4s;
}

/* slight random rotation */
.call-grid img:nth-child(1){transform:rotate(-6deg);}
.call-grid img:nth-child(2){transform:rotate(5deg);}
.call-grid img:nth-child(3){transform:rotate(-4deg);}
.call-grid img:nth-child(4){transform:rotate(6deg);}
.call-grid img:nth-child(5){transform:rotate(-5deg);}
.call-grid img:nth-child(6){transform:rotate(4deg);}
.call-grid img:nth-child(7){transform:rotate(-3deg);}
.call-grid img:nth-child(8){transform:rotate(5deg);}

.call-grid img:hover{
transform:rotate(0deg) scale(1.08);
}

/* FALLING */
.heart,.star{
position:fixed;
top:-20px;
font-size:22px;
pointer-events:none;
animation:fall linear forwards;
z-index:0;
}

@keyframes fall{
to{transform:translateY(100vh);opacity:0;}
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="section" id="page1">
<h1 class="main-title">Happy Birthday To You<br>Sanjam Panta</h1>
<button onclick="nextPage1()">Next ➜</button>
</div>

<!-- PAGE 2 -->
<div class="section" id="page2">
<h1>Memories 💙</h1>
<div class="media-grid">
<video src="v1.mp4" autoplay muted loop></video>
<video src="v2.mp4" autoplay muted loop></video>
<video src="v3.mp4" autoplay muted loop></video>
<img src="p1.jpg">
<img src="p2.jpg">
<img src="p3.jpg">
<img src="p4.jpg">
<img src="p5.jpg">
<img src="p6.jpg">
</div>
<button onclick="prevPage2()">⬅</button>
<button onclick="nextPage2()">Next ➜</button>
</div>

<!-- PAGE 3 -->
<div class="section" id="page3">
<h1>Our Friendship 💖🩵✨</h1>
<p style="max-width:700px;margin-top:20px;">
No matter how much we fight, laugh, or stay on calls for hours,
our bond never changes. You are my constant happiness,
my favorite notification, and my forever best friend.
</p>
<button onclick="prevPage3()">⬅</button>
<button onclick="nextPage3()">Next 📞</button>
</div>

<!-- PAGE 4 -->
<div class="section" id="page4">
<h1>📞 Call Memories 🩵</h1>
<div class="call-grid">
<img src="call1.jpg">
<img src="call2.jpg">
<img src="call3.jpg">
<img src="call4.jpg">
<img src="call5.jpg">
<img src="call6.jpg">
<img src="call7.jpg">
<img src="call8.jpg">
</div>
<button onclick="prevPage4()">⬅ Back</button>
</div>

<script>

/* NAVIGATION */
function nextPage1(){
document.body.classList.add("active-page2");
startBlue();
}
function prevPage2(){
document.body.classList.remove("active-page2");
startPink();
}
function nextPage2(){
document.body.classList.remove("active-page2");
document.body.classList.add("active-page3");
startAll();
}
function prevPage3(){
document.body.classList.remove("active-page3");
document.body.classList.add("active-page2");
startBlue();
}
function nextPage3(){
document.body.classList.remove("active-page3");
document.body.classList.add("active-page4");
startBlue();
}
function prevPage4(){
document.body.classList.remove("active-page4");
document.body.classList.add("active-page3");
startAll();
}

/* FALLING EFFECT */
let pinkInterval,blueInterval,starInterval;

function createPink(){
let e=document.createElement("div");
e.className="heart";
e.innerHTML="💖";
e.style.left=Math.random()*100+"vw";
e.style.animationDuration=3+Math.random()*2+"s";
document.body.appendChild(e);
setTimeout(()=>e.remove(),5000);
}

function createBlue(){
let e=document.createElement("div");
e.className="heart";
e.innerHTML="🩵";
e.style.left=Math.random()*100+"vw";
e.style.animationDuration=3+Math.random()*2+"s";
document.body.appendChild(e);
setTimeout(()=>e.remove(),5000);
}

function createStar(){
let e=document.createElement("div");
e.className="star";
e.innerHTML="✨";
e.style.left=Math.random()*100+"vw";
e.style.animationDuration=3+Math.random()*2+"s";
document.body.appendChild(e);
setTimeout(()=>e.remove(),5000);
}

function stopAll(){
clearInterval(pinkInterval);
clearInterval(blueInterval);
clearInterval(starInterval);
}

function startPink(){
stopAll();
pinkInterval=setInterval(createPink,700);
}

function startBlue(){
stopAll();
blueInterval=setInterval(createBlue,700);
}

function startAll(){
stopAll();
pinkInterval=setInterval(createPink,900);
blueInterval=setInterval(createBlue,800);
starInterval=setInterval(createStar,700);
}

/* Start page1 effect */
startPink();

</script>
</body>
</html>
